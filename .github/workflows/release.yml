name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        run: ./gradlew shadowJar
        env:
          # Gradle runs on Java 21; the toolchain auto-provisions Java 25 for javac
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "ToolWarn v${{ steps.version.outputs.VERSION }}"
          files: build/libs/ToolWarn-${{ steps.version.outputs.VERSION }}.jar
          generate_release_notes: true
